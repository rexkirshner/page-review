<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Review promotional artwork</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body {
        display: grid;
        place-items: center;
        color: #fffdf7;
        background:
          radial-gradient(circle at 82% 20%, rgba(255, 77, 36, .26), transparent 31%),
          linear-gradient(145deg, #19201c 0%, #285c49 100%);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .small, .marquee { width: 100%; height: 100%; }
      .small { display: grid; place-items: center; }
      .small img { width: 53%; max-height: 84%; object-fit: contain; filter: drop-shadow(0 15px 24px rgba(0, 0, 0, .28)); }
      .marquee { display: none; grid-template-columns: 43% 57%; align-items: center; padding: 38px 7%; }
      .marquee img { width: 78%; max-height: 90%; justify-self: center; object-fit: contain; filter: drop-shadow(0 22px 32px rgba(0, 0, 0, .3)); }
      .copy { max-width: 640px; }
      h1 { margin: 0 0 18px; font-size: clamp(48px, 6vw, 86px); line-height: .95; letter-spacing: -.055em; }
      p { max-width: 610px; margin: 0; color: #e8eadf; font: 600 clamp(19px, 2vw, 30px)/1.35 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
      body[data-format="marquee"] .small { display: none; }
      body[data-format="marquee"] .marquee { display: grid; }
    </style>
  </head>
  <body>
    <div class="small"><img src="../../assets/icon-master.png" alt=""></div>
    <div class="marquee">
      <img src="../../assets/icon-master.png" alt="">
      <div class="copy">
        <h1>Page Review</h1>
        <p>Annotate webpages and export structured feedback.</p>
      </div>
    </div>
    <script>
      if (new URLSearchParams(location.search).get("format") === "marquee") document.body.dataset.format = "marquee";
    </script>
  </body>
</html>
